<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crashing Live MONITOR - Panel de Control & Telemetría en Tiempo Real</title>
    <meta name="description" content="Crashing Live MONITOR: Panel de control y telemetría en tiempo real para Windows Server y Windows 11. Separación de 3 instaladores (monitoreo, monitor escritorio, app Android) y diagnóstico IA." />
    <meta property="og:title" content="Crashing Live MONITOR - Panel de Control & Telemetría" />
    <meta property="og:description" content="Crashing Live MONITOR: Panel de control y telemetría en tiempo real para Windows Server y Windows 11." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Iconos Oficiales Crashing LIVE (Rutas relativas seguras) -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="64x64" href="./logo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./logo192.png" />
    <link rel="apple-touch-icon" href="./logo192.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#00ff66" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=VT323&display=swap" rel="stylesheet">

    <!-- Diagnóstico Global Temprano para Prevenir Pantalla en Negro (Black Screen) -->
    <script>
      window.__CRASHING_LIVE_ERRORS = [];
      window.addEventListener('error', function(e) {
        console.error('[CrashingLive Global Error]', e.message, e.filename, e.lineno);
        window.__CRASHING_LIVE_ERRORS.push({ message: e.message, source: e.filename, line: e.lineno });
        showEarlyErrorFallback(e.message || 'Error desconocido al cargar módulo');
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[CrashingLive Unhandled Rejection]', e.reason);
        window.__CRASHING_LIVE_ERRORS.push({ message: String(e.reason) });
      });

      function showEarlyErrorFallback(msg) {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.indexOf('cl-init-loader') !== -1)) {
          root.innerHTML = '<div style="min-height:100vh;background:#0e0e0e;color:#fff;font-family:monospace;display:flex;align-items:center;justify-content:center;padding:20px;">' +
            '<div style="max-width:560px;width:100%;background:#181818;border:1px solid #ff4444;border-radius:16px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,0.8);">' +
            '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">' +
            '<div style="width:36px;height:36px;border-radius:8px;background:rgba(255,68,68,0.2);color:#ff4444;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;">!</div>' +
            '<div><h3 style="margin:0;font-size:15px;color:#fff;">CRASHING LIVE • ERROR DE INICIO</h3><span style="font-size:11px;color:#aaa;">Se capturó un fallo antes del montaje de la interfaz</span></div>' +
            '</div>' +
            '<div style="background:#111;padding:12px;border-radius:8px;font-size:12px;color:#ff8888;margin-bottom:16px;overflow-x:auto;word-break:break-all;">' + msg + '</div>' +
            '<button onclick="window.location.reload()" style="background:#ff6600;color:#000;border:none;padding:10px 18px;border-radius:8px;font-weight:bold;cursor:pointer;font-family:monospace;font-size:12px;">Reintentar / Recargar</button>' +
            '</div></div>';
        }
      }
    </script>
  </head>
  <body class="bg-black text-white antialiased selection:bg-[#ff6b00] selection:text-black">
    <div id="root">
      <!-- Fallback visual mientras carga el módulo para evitar parpadeo o pantalla negra -->
      <div id="cl-init-loader" style="min-height:100vh;background:#0d0d0d;color:#fff;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;">
        <div style="width:48px;height:48px;border-radius:12px;background:#181818;border:1px solid #262626;display:flex;align-items:center;justify-content:center;color:#00ff66;font-size:14px;font-weight:bold;box-shadow:0 0 20px rgba(0,255,102,0.15);">
          CL
        </div>
        <div style="font-size:12px;color:#888;letter-spacing:1px;text-transform:uppercase;">
          Iniciando Crashing LIVE Monitor...
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
